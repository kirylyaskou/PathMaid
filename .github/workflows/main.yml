name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const isPrerelease = tag.includes('-');
            const body = `## Downloads

            Platform binaries are listed under **Assets** below:

            - \`PathMaid_*_x64-setup.exe\` / \`PathMaid_*_x64_en-US.msi\` — Windows
            - \`PathMaid_*_aarch64.dmg\` — macOS (Apple Silicon, manual install only — auto-update disabled on macOS until notarization is configured)
            - \`PathMaid_*_amd64.AppImage\` / \`PathMaid_*_amd64.deb\` — Linux

            ## Auto-update

            Starting from **v1.5.0**, PathMaid updates itself automatically on Windows and Linux. If you're on **v1.4.1 or earlier**, you'll need to download and install this version manually **one last time** — all future updates will be delivered through the app's built-in updater.

            Installer signatures (\`.sig\`) are attached alongside each installer — the updater verifies them cryptographically before applying an update.

            > \`Source code (zip)\` and \`Source code (tar.gz)\` are GitHub's auto-generated tarballs from the git tag — **not the intended downloads**. Use a platform binary above.`;

            const releaseParams = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `pathmaid ${tag}`,
              body: body,
              draft: true,
              prerelease: isPrerelease,
            };

            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: data.id,
                name: releaseParams.name,
                body: releaseParams.body,
                draft: releaseParams.draft,
                prerelease: releaseParams.prerelease,
              });
              core.setOutput('release_id', data.id);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              const { data } = await github.rest.repos.createRelease(releaseParams);
              core.setOutput('release_id', data.id);
            }

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles msi,nsis
          - os: ubuntu-22.04
            args: --bundles deb,appimage
          - os: macos-latest
            args: --bundles dmg,app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build OCR sidecar
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src-tauri/ocr/requirements.txt pyinstaller
          PADDLE_PDX_CACHE_HOME="$(python -c 'from pathlib import Path; print(Path("src-tauri/ocr-models").resolve())')"
          export PADDLE_PDX_CACHE_HOME
          export PADDLE_PDX_MODEL_SOURCE="BOS"
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          image = Image.new("RGB", (320, 80), "white")
          draw = ImageDraw.Draw(image)
          draw.text((16, 24), "PathMaid OCR warmup", fill="black")
          Path("target").mkdir(exist_ok=True)
          image.save("target/pathmaid-ocr-warmup.png")
          PY
          python src-tauri/ocr/paddle_ocr.py --input target/pathmaid-ocr-warmup.png --lang en > target/pathmaid-ocr-warmup.json
          test -d src-tauri/ocr-models/official_models
          python - <<'PY'
          import importlib.metadata
          import subprocess
          import sys

          import paddlex

          dep_specs = getattr(paddlex.utils.deps, "DEP_SPECS", None)
          if dep_specs is None:
              dep_specs = paddlex.utils.deps.BASE_DEP_SPECS
          deps_all = set(dep_specs.keys())
          deps_need = sorted({
              dist.metadata["Name"]
              for dist in importlib.metadata.distributions()
              if dist.metadata["Name"] in deps_all
          })

          cmd = [
              sys.executable,
              "-m",
              "PyInstaller",
              "--clean",
              "--onefile",
              "--name",
              "pathmaid-ocr",
              "--collect-data",
              "paddlex",
              "--collect-binaries",
              "paddle",
              "--collect-all",
              "paddleocr",
          ]
          for dep in deps_need:
              cmd += ["--copy-metadata", dep]
          cmd.append("src-tauri/ocr/paddle_ocr.py")
          print("PyInstaller command:", " ".join(cmd))
          subprocess.run(cmd, check=True)
          PY
          mkdir -p src-tauri/ocr-bin
          if [ -f dist/pathmaid-ocr.exe ]; then
            cp dist/pathmaid-ocr.exe src-tauri/ocr-bin/pathmaid-ocr.exe
          else
            cp dist/pathmaid-ocr src-tauri/ocr-bin/pathmaid-ocr
            chmod +x src-tauri/ocr-bin/pathmaid-ocr
          fi

      - name: Validate cloud release config
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_SUPABASE_URL:-}" ] || [ -z "${VITE_SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Missing VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY GitHub Actions secrets. Release builds would disable cloud sync."
            exit 1
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          updaterJsonPreferNsis: true

      - name: Upload stable download aliases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          case "${{ matrix.os }}" in
            windows-latest)
              source_glob="src-tauri/target/release/bundle/nsis/PathMaid_*_x64-setup.exe"
              alias_path="target/release-aliases/PathMaid_windows_x64-setup.exe"
              ;;
            macos-latest)
              source_glob="src-tauri/target/release/bundle/dmg/PathMaid_*_aarch64.dmg"
              alias_path="target/release-aliases/PathMaid_macos_aarch64.dmg"
              ;;
            ubuntu-22.04)
              source_glob="src-tauri/target/release/bundle/appimage/PathMaid_*_amd64.AppImage"
              alias_path="target/release-aliases/PathMaid_linux_amd64.AppImage"
              ;;
            *)
              echo "No stable download alias configured for ${{ matrix.os }}"
              exit 0
              ;;
          esac

          shopt -s nullglob
          matches=( $source_glob )
          if [ "${#matches[@]}" -ne 1 ]; then
            echo "Expected exactly one release asset for: $source_glob"
            echo "Found: ${#matches[@]}"
            find src-tauri/target/release/bundle -maxdepth 3 -type f | sort
            exit 1
          fi

          mkdir -p "$(dirname "$alias_path")"
          cp "${matches[0]}" "$alias_path"
          gh release upload "$GITHUB_REF_NAME" "$alias_path" --clobber

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const isPrerelease = tag.includes('-');
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.RELEASE_ID,
              draft: false,
              make_latest: isPrerelease ? 'false' : 'true',
            });
